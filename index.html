(function () {

  var installed = false;

    var panel = document.getElementById("dregWrap");
    if (!panel || panel.__finalPanelDragInstalled) return !!panel;
    panel.__finalPanelDragInstalled = true;

    var style = document.createElement("style");
    style.id = "final-panel-drag-fix-style";

      "#dregWrap.panel-dragging{cursor:grabbing!important;user-select:none!important;" +

    var pointerId = null;

      if (!e.isPrimary || isInteractive(e.target)) return;
      if (e.pointerType === "mouse" && e.button !== 0) return;

      panelHeight = rect.height;

      startY = e.clientY;
      startLeft = rect.left;
      startTop = rect.top;
      pointerId = e.pointerId;
      dragging = true;

      panel.classList.add("placed", "panel-dragging");
      panel.style.setProperty("left", startLeft + "px", "important");
      panel.style.setProperty("top", startTop + "px", "important");
      panel.style.setProperty("right", "auto", "important");
      panel.style.setProperty("bottom", "auto", "important");
      panel.style.setProperty("transform", "none", "important");
      panel.style.setProperty("animation", "none", "important");

      if (!dragging || e.pointerId !== pointerId) return;

      panel.style.setProperty("left", left + "px", "important");
      panel.style.setProperty("top", top + "px", "important");
      panel.style.setProperty("transform", "none", "important");
      e.preventDefault();
      e.stopPropagation();
    }

    function end(e) {
      if (!dragging || (e && e.pointerId !== pointerId)) return;
      dragging = false;
      pointerId = null;

        e.stopPropagation();

    panel.addEventListener("pointerup", end, true);

    window.addEventListener("pointerup", end, true);
    window.addEventListener("pointercancel", end, true);
